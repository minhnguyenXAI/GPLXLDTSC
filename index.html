<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Khai báo GPLX</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --nen: var(--tg-theme-secondary-bg-color, #eef3fa);
    --the: var(--tg-theme-bg-color, #ffffff);
    --chu: var(--tg-theme-text-color, #1d2836);
    --mo: var(--tg-theme-hint-color, #5a6b80);
    --nhan: #2f6f4f;
    --vien: rgba(47, 111, 79, 0.30);
    --do: #b3475b;
    --vang-nen: rgba(201, 138, 18, 0.14);
    --vang-chu: #8a5e08;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --nen: var(--tg-theme-secondary-bg-color, #141a24);
      --the: var(--tg-theme-bg-color, #1c2431);
      --chu: var(--tg-theme-text-color, #e9eef6);
      --mo: var(--tg-theme-hint-color, #a3b3c7);
      --nhan: #6cc79a; --vien: rgba(108, 199, 154, 0.35);
      --do: #e88799; --vang-chu: #e5b45a; --vang-nen: rgba(229, 180, 90, 0.16);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 12px 12px 96px; background: var(--nen); color: var(--chu);
         font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  h1 { font-size: 19px; margin: 4px 4px 12px; }
  .the { background: var(--the); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  label { display: block; font-weight: 600; margin: 12px 0 6px; }
  label:first-child { margin-top: 0; }
  .goi-y { color: var(--mo); font-size: 13px; margin-top: 4px; }
  input { width: 100%; padding: 12px; font-size: 16px; border-radius: 10px;
          border: 1.5px solid var(--vien); background: transparent; color: var(--chu); }
  input:focus { outline: none; border-color: var(--nhan); }
  input[readonly] { opacity: .8; }
  .loi { color: var(--do); font-size: 13px; margin-top: 4px; min-height: 1em; }
  .luu-y { background: var(--vang-nen); color: var(--vang-chu); border-radius: 12px;
           padding: 12px 14px; font-size: 14px; }
  .luu-y b { display: block; margin-bottom: 4px; }
  button { width: 100%; padding: 14px; font-size: 17px; font-weight: 700; border: 0;
           border-radius: 12px; background: var(--nhan); color: #fff; margin-top: 12px; }
</style>
</head>
<body>
<h1>📋 Khai báo điểm GPLX</h1>

<div class="the">
  <label for="ngay">Ngày khai báo</label>
  <input id="ngay" readonly>
  <div class="goi-y">Bot ghi theo giờ Bác Tài gửi ảnh.</div>

  <label for="ky">Kỳ khai báo</label>
  <input id="ky" readonly>
  <div class="goi-y" id="han"></div>

  <label for="id">ID nhân viên</label>
  <input id="id" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="Chỉ gồm chữ số">
  <div class="loi" id="loi-id"></div>

  <label for="ten">Tên nhân viên</label>
  <input id="ten" autocomplete="name" autocapitalize="words" placeholder="Ví dụ: Nguyễn Văn Minh">
  <div class="loi" id="loi-ten"></div>
</div>

<div class="luu-y">
  <b>Sau khi bấm Gửi:</b>
  Mở VNeTraffic → Thông tin GPLX, <u>chụp màn hình ngay</u> (giữ nguyên đồng hồ trên cùng)
  rồi gửi ảnh vào khung chat với bot. Ảnh cũ trong thư viện sẽ bị từ chối.
</div>

<button id="gui" type="button">Gửi thông tin</button>

<script>
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }
  const q = new URLSearchParams(location.search);
  const $ = (id) => document.getElementById(id);

  function luuTam(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function docTam(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } }

  // Ky tinh tai bot (theo gio VN), form chi hien thi
  function kyTuTinh() {
    const vn = new Date(Date.now() + (new Date().getTimezoneOffset() + 420) * 60000);
    let d = vn.getDate() <= 1 ? 1 : vn.getDate() <= 16 ? 16 : 1;
    let m = vn.getMonth() + 1;
    if (vn.getDate() > 16) m = m % 12 + 1;
    return String(d).padStart(2, "0") + "/" + String(m).padStart(2, "0");
  }
  const hai = (n) => String(n).padStart(2, "0");
  const nay = new Date();
  $("ngay").value = hai(nay.getDate()) + "/" + hai(nay.getMonth() + 1) + "/" + nay.getFullYear()
                    + " " + hai(nay.getHours()) + ":" + hai(nay.getMinutes());
  $("ky").value = q.get("ky") || kyTuTinh();
  $("han").textContent = q.get("han") ? "Hạn chót: " + q.get("han") : "";
  $("id").value = q.get("id") || docTam("gplx_id");
  $("ten").value = q.get("ten") || docTam("gplx_ten");

  function vietHoa(s) {
    return s.replace(/\s+/g, " ").trimStart().split(" ")
      .map(t => t ? t.charAt(0).toLocaleUpperCase("vi") + t.slice(1).toLocaleLowerCase("vi") : t)
      .join(" ");
  }
  $("id").addEventListener("input", (e) => { e.target.value = e.target.value.replace(/\D/g, ""); });
  $("ten").addEventListener("input", (e) => {
    const vt = e.target.selectionStart;
    e.target.value = vietHoa(e.target.value);
    e.target.setSelectionRange(vt, vt);
  });

  $("gui").addEventListener("click", () => {
    const id = $("id").value.trim(), ten = vietHoa($("ten").value).trim();
    $("loi-id").textContent = /^\d+$/.test(id) ? "" : "ID chỉ gồm chữ số.";
    $("loi-ten").textContent = ten.split(" ").length >= 2 ? "" : "Nhập đầy đủ họ và tên.";
    if ($("loi-id").textContent || $("loi-ten").textContent) return;
    luuTam("gplx_id", id); luuTam("gplx_ten", ten);
    const duLieu = JSON.stringify({ loai: "gplx", id_nv: id, ten: ten, ky: $("ky").value });
    if (tg && tg.sendData) tg.sendData(duLieu);
    else alert("Hãy mở form này từ nút trong Telegram.");
  });
</script>
</body>
</html>
